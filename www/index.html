<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111218">
<title>Planif</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 480px at 8% -12%,var(--glow),transparent 60%),radial-gradient(900px 420px at 108% -4%,var(--glow),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-flex;flex:none}
/* ---------- header ---------- */
.chrome{position:sticky;top:0;z-index:50;background:var(--chrome);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accentText);box-shadow:0 6px 18px var(--glow);flex:none}
.bt{min-width:0}
.who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:6px}
.weekbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:180px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);line-height:1.15}
.weekbtn .wk{font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.weekbtn .range{font-size:14px;font-weight:650;white-space:nowrap}
.acts{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:transform .15s,border-color .15s,background .15s;flex:none;padding:0}
.ib:hover{border-color:var(--accent)}
.ib:active{transform:scale(.93)}
.ib.danger{color:#E5484D;background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:650;font-size:14px;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent;box-shadow:0 6px 16px var(--glow)}
.btn.soft{background:var(--surface2)}
.btn.danger{background:#E5484D;color:#fff;border-color:transparent}
.btn.danger.ghost{background:transparent;color:#E5484D;border-color:#E5484D66}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.big{height:50px;justify-content:flex-start;width:100%;margin-bottom:8px}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);flex:none}
.seg-b{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-weight:650;font-size:13px;color:var(--muted);transition:.2s}
.seg-b.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.vt{display:none!important}
.savepill{font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s;white-space:nowrap}
.savepill.show{opacity:1}
/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:3px;margin-top:10px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--border);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{display:none}
.tb{position:relative;min-width:34px;height:34px;padding:0 7px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--text);flex:none;transition:background .15s,color .15s}
.tb:hover{background:var(--surface2)}
.tb.on{background:var(--accent);color:var(--accentText)}
.tb .L{font-size:15px;font-family:Georgia,"Times New Roman",serif;line-height:1}
.tb .A{font-weight:800;font-size:15px;line-height:1;margin-top:-5px}
.cbar{position:absolute;left:9px;right:9px;bottom:5px;height:4px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tsel{height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 6px;font:inherit;font-size:13px;flex:none}
.tsel.font{width:138px}
.tsel.size{width:66px}
.tsep{width:1px;height:22px;background:var(--border);margin:0 4px;flex:none}
/* ---------- grid ---------- */
.main{padding:14px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:2px 4px 8px}
.grid{display:grid;gap:6px;--tc:68px;--cm:150px}
.anim-l{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.anim-r{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.anim-f{animation:fade .3s ease}
@keyframes inL{from{opacity:0;transform:translateX(28px)}}
@keyframes inR{from{opacity:0;transform:translateX(-28px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.dayhead{padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.dayhead .dn{font-weight:750;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead .dd{font-size:12px;color:var(--muted);white-space:nowrap}
.dayhead.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accentText);border-color:transparent;box-shadow:0 8px 20px var(--glow)}
.dayhead.today .dd{color:inherit;opacity:.85}
.time{position:sticky;left:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-variant-numeric:tabular-nums;text-align:center;min-width:0}
.time .num{font-size:17px;font-weight:800;line-height:1.1}
.time .tr{font-size:11px;color:var(--muted);line-height:1.2}
.time .tl{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.time.t-break,.time.t-lunch{background:var(--bg);border-style:dashed}
.time.t-admin{box-shadow:inset 3px 0 0 var(--admin)}
.ticon{color:var(--muted)}
.time.t-admin .ticon{color:var(--admin)}
.cell{position:relative;border-radius:14px;background:var(--cell);color:var(--cellText);border:1px solid var(--border);min-height:66px;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s,border-color .2s;overflow:hidden;min-width:0}
.cell:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.cell.t-break,.cell.t-lunch{min-height:34px;background-image:repeating-linear-gradient(135deg,transparent 0 7px,var(--stripe) 7px 14px)}
.cell.t-admin{box-shadow:inset 3px 0 0 var(--admin)}
.cell .tag{position:absolute;top:7px;left:11px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--admin);pointer-events:none}
.cell.t-admin .note,.cell.t-other .note{padding-top:22px}
.note{flex:1;padding:8px 10px;outline:none;font-family:var(--nf);font-size:var(--ns);line-height:1.4;overflow-wrap:anywhere;cursor:text;min-height:30px}
.note:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7;pointer-events:none}
.lesson .note:empty:not(:focus)::before,.free:not(.t-break):not(.t-lunch) .note:empty:not(:focus)::before{content:""}
.t-break .note:empty::before,.t-lunch .note:empty::before{display:block;text-align:center;font-family:inherit;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.55}
.t-break .note,.t-lunch .note{padding:6px 10px}
.note a{color:var(--accent);text-decoration:underline}
.note ul,.note ol{margin:2px 0;padding-left:20px}
.note ul.chk{list-style:none;padding-left:2px}
.note ul.chk li{position:relative;padding-left:24px;margin:2px 0}
.note ul.chk li::before{content:"";position:absolute;left:0;top:.15em;width:16px;height:16px;border:2px solid var(--muted);border-radius:5px;box-sizing:border-box;cursor:pointer;font-size:11px;line-height:12px;text-align:center;font-weight:900}
.note ul.chk li.done{text-decoration:line-through;opacity:.6}
.note ul.chk li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.note hr{border:0;border-top:1px dashed var(--border);margin:6px 0}
.cell.flash{animation:flash 1.8s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent),0 0 30px var(--glow)}}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:14px;background:var(--surface);border:1px solid var(--admin);font-size:14px}
.banner .ic{color:var(--admin)}
.banner span.tx{flex:1;min-width:180px}
.menu{display:flex;flex-direction:column;gap:2px;min-width:260px;max-width:320px}
.pop.sheet .menu{max-width:none}
.mi{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border:0;border-radius:10px;background:transparent}
.mi:hover{background:var(--surface2)}
.mi .ic{color:var(--accent);margin-top:1px}
.mi b{display:block;font-size:14px}
.mi small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.wp{width:290px;display:flex;flex-direction:column;gap:8px}
.pop.sheet .wp{width:auto}
.wpl{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.wpi{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:0;border-radius:9px;background:transparent;font-size:13px}
.wpi:hover{background:var(--surface2)}
.wpi.on{background:var(--accent);color:var(--accentText)}
.wpi.now:not(.on) .wpw{color:var(--accent)}
.wpw{font-weight:750}
.sres{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.sri{display:block;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2)}
.srh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.srh span:first-child{font-weight:700;color:var(--text)}
.srs{font-size:13px}
.srs mark{background:var(--accent);color:var(--accentText);border-radius:3px;padding:0 2px}
.tplrow{padding:10px;border-radius:12px;background:var(--surface2);margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.tplrow .inp{background:var(--surface)}
textarea.inp{height:auto;min-height:96px;padding:8px 10px;resize:vertical;line-height:1.4}
.snap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);margin-bottom:6px;font-size:14px}
.note p{margin:0}
.cell .add{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:1px dashed var(--muted);background:var(--surface);color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .2s,transform .2s,color .2s;z-index:1;padding:0}
.cell:hover .add,.cell:focus-within .add{opacity:1}
@media (hover:none){.cell .add{opacity:.6}}
.cell .add:hover{color:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.lesson{background:linear-gradient(var(--ct),var(--ct)),var(--cell);border-color:transparent;box-shadow:0 8px 20px -14px var(--c)}
.lesson:hover{transform:translateY(-1px)}
.lh{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:7px 10px;border:0;background:var(--c);color:var(--cx);text-align:left;font-weight:750;font-size:13px}
.lh .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .lt{font-size:11px;font-weight:650;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 26px var(--glow);animation:pulse 2.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--accent),0 0 6px var(--glow)}}
.offcell{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px 10px;background:var(--surface);border:1px dashed var(--border);color:var(--muted)}
.offcell .ofk{font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.offcell.holiday .ic{color:#F5A524}
.offcell.vacation .ic{color:var(--accent)}
.daytabs{display:flex;gap:6px;margin-bottom:12px}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;border:1px solid var(--border);background:var(--surface);transition:.2s}
.dt .dtn{font-size:12px;color:var(--muted);text-transform:capitalize;font-weight:650}
.dt .dtd{font-size:18px;font-weight:800}
.dt.today .dtn{color:var(--accent)}
.dt.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accentText);border-color:transparent;box-shadow:0 8px 18px var(--glow)}
.dt.on .dtn{color:inherit;opacity:.85}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
/* ---------- popover / modal / toast ---------- */
.popbd{position:fixed;inset:0;z-index:900}
.pop{position:fixed;z-index:901;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:12px;opacity:0;transform:translateY(-4px) scale(.98);transition:opacity .16s,transform .16s;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto}
.pop.in{opacity:1;transform:none}
.pop.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateY(24px)}
.pop.sheet.in{transform:none}
.mbd{position:fixed;inset:0;z-index:500;background:rgba(5,6,10,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .18s}
.mbd.in{opacity:1}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.mbd.in .modal{transform:none}
.modal.small{width:min(460px,100%)}
.modal.large{width:min(1000px,100%);height:min(780px,calc(100vh - 32px))}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border)}
.mh h2{margin:0;font-size:18px}
.mb{flex:1;overflow:auto;padding:16px 18px;min-height:0}
.modal.large .mb{padding:0;overflow:hidden}
.mf{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.sp{flex:1}
.msg{margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;transition:.25s;z-index:2000;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.lb{display:flex;flex-direction:column;gap:10px;max-width:300px}
.lurl{font-size:13px;color:var(--muted);word-break:break-all}
/* ---------- color picker ---------- */
.cp{width:288px}
.pop.sheet .cp{width:auto}
.cp-sv{position:relative;height:150px;border-radius:12px;background-image:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,rgba(255,255,255,0));touch-action:none;cursor:crosshair}
.cp-hue{position:relative;height:14px;border-radius:7px;margin:14px 0 12px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;cursor:pointer}
.cp-k{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue .cp-k{top:50%}
.cp-row{display:flex;gap:8px;align-items:center}
.cp-prev{width:40px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.cp-hex{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.cp-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
.cp-sw{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.cp-sw button{aspect-ratio:1;min-height:22px;border-radius:7px;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .12s}
.cp-sw button:hover{transform:scale(1.15)}
.cp-foot{display:flex;gap:8px;margin-top:14px}
/* ---------- forms / settings ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field>span{font-size:12.5px;font-weight:650;color:var(--muted)}
.inp{height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 10px;font:inherit;font-size:14px;min-width:0;width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row{display:flex;gap:8px;align-items:center}
.row>.inp{flex:1}
.sh{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;font-weight:800}
.section:first-child .sh{margin-top:4px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chipb{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-weight:650;font-size:13px;text-transform:capitalize;display:inline-flex;align-items:center;gap:6px}
.chipb.on{background:var(--accent);color:var(--accentText);border-color:transparent}
.chipb .cnt{font-size:11px;background:rgba(127,127,127,.25);padding:0 7px;border-radius:999px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);font-weight:700}
.lc .flag{font-size:11px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--accent)}
.lc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.thc{padding:6px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);text-align:center;font-weight:650;font-size:13px;transition:transform .15s}
.thc:hover{transform:translateY(-2px)}
.thc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.thp{height:58px;border-radius:9px;display:flex;align-items:flex-end;gap:4px;padding:8px;margin-bottom:6px}
.thp i{flex:1;height:55%;border-radius:5px}
.thp i:nth-child(2){height:85%}
.tm{width:300px}
.pop.sheet .tm{width:auto}
.settings{display:grid;grid-template-columns:210px 1fr;height:100%}
.snav{display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid var(--border);overflow:auto}
.sn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:650;text-align:left;white-space:nowrap;flex:none}
.sn.on{background:var(--surface2);color:var(--text)}
.sn.on .ic{color:var(--accent)}
.spanel{padding:18px 20px 28px;overflow:auto;min-height:0}
.srow,.ttrow,.subrow,.yrow{display:grid;gap:6px;align-items:center;padding:6px;border-radius:12px;background:var(--surface2);margin-bottom:6px;border:1px solid transparent}
.srow .inp,.ttrow .inp,.subrow .inp,.yrow .inp{background:var(--surface)}
.srow{grid-template-columns:28px 140px 1fr 124px 124px 52px 40px;grid-template-areas:"i ty lb st en du x"}
.srow>.sic{grid-area:i}.srow>.stype{grid-area:ty}.srow>.lbl{grid-area:lb}.srow>.st{grid-area:st}.srow>.en{grid-area:en}.srow>.dur{grid-area:du}.srow>.del{grid-area:x}
.srow.warn{border-color:#E5484D}
.sic{color:var(--muted);display:grid;place-items:center}
.srow.t-lesson .sic{color:var(--accent)}
.srow.t-admin .sic{color:var(--admin)}
.dur{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ttrow{grid-template-columns:1.3fr 84px 1fr 1fr .8fr .8fr 40px;grid-template-areas:"su wk fr to cl ro x";box-shadow:inset 4px 0 0 var(--c)}
.ttrow>.wk{grid-area:wk}.ttrow>.su{grid-area:su}.ttrow>.fr{grid-area:fr}.ttrow>.to{grid-area:to}.ttrow>.cl{grid-area:cl}.ttrow>.ro{grid-area:ro}.ttrow>.del{grid-area:x}
.subrow{grid-template-columns:44px 1fr 96px 44px 40px}
.yrow{grid-template-columns:1fr 160px 160px 40px;grid-template-areas:"nm st en x"}
.yrow>.nm{grid-area:nm}.yrow>.st{grid-area:st}.yrow>.en{grid-area:en}.yrow>.del{grid-area:x}
.yrow.hd{grid-template-columns:1fr 160px 40px;grid-template-areas:"nm st x"}
.count{font-size:12px;color:var(--muted);text-align:center}
.swatch{width:40px;height:40px;border-radius:10px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);flex:none;padding:0}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface2);margin-bottom:16px}
.card p{margin:0}
.card .ic{color:var(--accent)}
.ver{font-size:12px;color:var(--muted);margin-top:18px}
.calbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--glow),transparent);border:1px solid var(--border);margin-bottom:18px}
.calbox p{flex:1 1 100%;margin:0 0 4px;font-size:13px;color:var(--muted)}
.calprev{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:14px}
.calprev h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.calprev h4:first-child{margin-top:0}
.cpl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
.cpl:last-child{border-bottom:0}
.cpl span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.warnText{color:var(--admin)!important;font-weight:600}
.summary{font-size:13px;color:var(--muted);margin:8px 0 0}
details.gen{border:1px solid var(--border);border-radius:14px;padding:2px 14px;background:var(--surface2);margin-bottom:8px}
details.gen[open]{padding-bottom:14px}
details.gen summary{cursor:pointer;font-weight:750;padding:12px 0;display:flex;align-items:center;gap:8px;list-style:none}
details.gen summary::-webkit-details-marker{display:none}
details.gen summary .ic{color:var(--accent)}
details.gen .inp{background:var(--surface)}
.gform{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.genprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gp{font-size:11px;padding:3px 7px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.gp.t-lesson{background:var(--accent);color:var(--accentText);border-color:transparent}
.gp.t-lunch{background:var(--admin);color:#fff;border-color:transparent}
/* ---------- onboarding ---------- */
.onb{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.ocard{width:min(580px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:fade .4s ease}
.ocard h1{margin:6px 0;font-size:28px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 10px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dots i{height:6px;width:18px;border-radius:3px;background:var(--border);transition:.3s}
.dots i.on{width:38px;background:var(--accent)}
.dots i.done{background:var(--accent);opacity:.5}
.onav{display:flex;justify-content:space-between;margin-top:26px}
.logo.big{width:64px;height:64px;border-radius:20px;margin-bottom:12px}
.link{display:inline-flex;align-items:center;gap:6px;margin-top:20px;border:0;background:none;color:var(--accent);font-weight:650;padding:0}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .top{display:grid;grid-template-columns:1fr auto}
  .nav{grid-column:1 / -1;grid-row:2}
  .acts{grid-column:2;grid-row:1}
  .seg{display:none}
  .vt{display:inline-grid!important}
  .weekbtn{flex:1;min-width:0}
  .btn.today,.savepill{display:none}
  .top h1{font-size:16px}
  .logo{width:34px;height:34px}
  .grid{--tc:54px;--cm:140px}
  .mbd{padding:0;place-items:end stretch}
  .modal,.modal.small,.modal.large{width:100%;max-height:94vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal.large{height:94vh}
  .settings{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .snav{flex-direction:row;border-right:0;border-bottom:1px solid var(--border);padding:8px;scrollbar-width:none}
  .snav::-webkit-scrollbar{display:none}
  .spanel{padding:16px}
  .srow{grid-template-columns:1fr 1fr 48px 40px;grid-template-areas:"ty ty ty x" "lb lb lb lb" "st en du du"}
  .srow>.sic{display:none}
  .ttrow{grid-template-columns:1fr 1fr 76px;grid-template-areas:"su su x" "fr to to" "cl ro wk"}
  .subrow{grid-template-columns:44px 1fr 72px 40px}
  .subrow .count{display:none}
  .yrow{grid-template-columns:1fr 1fr 40px;grid-template-areas:"nm nm x" "st en en"}
  .yrow.hd{grid-template-columns:1fr 140px 40px;grid-template-areas:"nm st x"}
  .gform{grid-template-columns:1fr 1fr}
  .ocard{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const group = cfg.lessons.filter(l => key(l) === k), idx = {}; sortedSlots().forEach((s, i) => idx[s.id] = i);
  const days = shownDays(), occ = [];
  for (const m of weekList()) { const lt = weekLetter(m);
    for (const l of group) {
      if (lt && l.wk && l.wk !== 'all' && l.wk !== lt) continue; if (!days.includes(l.dow)) continue;
      const date = addDays(m, l.dow - 1); if (offInfo(date)) continue;
      occ.push({ m, date, key: l.dow + '|' + l.from, ord: idx[l.from] ?? 0 });
    } }
  return occ.sort((a, b) => a.date.localeCompare(b.date) || a.ord - b.ord);
}
async function applyWeeks(cache, before, msg) {
  for (const m in cache) await writeWeek(m, cache[m]);
  await loadNotes(); ui.anim = 'f'; renderBody();
  toast(msg, 6000, { label: t('undoAction'), fn: async () => { if (notesTimer) await flushNotes(); for (const m in before) await writeWeek(m, before[m]); await loadNotes(); ui.anim = 'f'; renderBody(); } });
}
async function shiftSeries(L, dow, dir) {
  if (notesTimer) await flushNotes();
  const occ = seriesOf(L), k = occ.findIndex(o => o.m === ui.monday && o.key === dow + '|' + L.from);
  if (k < 0) { toast(t('notInYear')); return; }
  const cache = {}; for (let i = k; i < occ.length; i++) if (!cache[occ[i].m]) cache[occ[i].m] = await readWeek(occ[i].m);
  const before = clone(cache), vals = occ.slice(k).map(o => cache[o.m][o.key] || '');
  if (dir > 0) { const last = vals.pop(); vals.unshift(''); if (last) vals[vals.length - 1] = vals[vals.length - 1] ? vals[vals.length - 1] + '<hr>' + last : last; }
  else { if (vals[0] && !await confirmDlg(t('shiftBackConfirm'), t('shiftBack'), true)) return; vals.shift(); vals.push(''); }
  occ.slice(k).forEach((o, i) => { if (vals[i]) cache[o.m][o.key] = vals[i]; else delete cache[o.m][o.key]; });
  await applyWeeks(cache, before, dir > 0 ? t('shiftedFwd') : t('shiftedBack'));
}
async function copyToNext(L, dow) {
  if (notesTimer) await flushNotes();
  const key = dow + '|' + L.from, html = notes[key]; if (!html) { toast(t('emptyNote')); return; }
  const occ = seriesOf(L), k = occ.findIndex(o => o.m === ui.monday && o.key === key);
  if (k < 0) { toast(t('notInYear')); return; } const nx = occ[k + 1]; if (!nx) { toast(t('noNext')); return; }
  const cache = { [nx.m]: nx.m === ui.monday ? clone(notes) : await readWeek(nx.m) }, before = clone(cache);
  const ex = cache[nx.m][nx.key]; cache[nx.m][nx.key] = ex ? ex + '<hr>' + html : html;
  await applyWeeks(cache, before, t('copied', { d: fmtDate(nx.date, { weekday: 'long', day: 'numeric', month: 'long' }) }));
}
const htmlText = html => { const tpl = document.createElement('template'); tpl.innerHTML = String(html).replace(/<(br|hr)[^>]*>|<\/(div|p|li)>/gi, ' '); return (tpl.content.textContent || '').replace(/\s+/g, ' ').trim(); };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function cellLabel(dow, sid) {
  const L = cfg.lessons.find(l => l.dow === dow && l.from === sid); const s = cfg.slots.find(x => x.id === sid);
  if (L) { const sub = cfg.subjects.find(x => x.id === L.subjectId); return (sub ? sub.name : '') + (L.cls ? ' · ' + L.cls : ''); }
  return s ? (s.label || t('type_' + s.type)) + ' · ' + fmtTime(s.start) : '';
}
function flashCell(key) {
  const n = document.querySelector(`.note[data-key="${key}"]`); const c = n && n.closest('.cell'); if (!c) return;
  c.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
}
async function openSearch() {
  if (notesTimer) await flushNotes();
  const inp = h('input', { class: 'inp', type: 'search', placeholder: t('searchPh'), autocomplete: 'off' }), res = h('div', { class: 'sres' });
  const m = modal(t('search'), h('div', null, inp, res), null, 'small'); setTimeout(() => inp.focus(), 80);
  const all = [];
  for (const mo of await wList()) { const w = await readWeek(mo); for (const [k, html] of Object.entries(w)) { const txt = htmlText(html); if (txt) all.push({ m: mo, k, txt, n: norm(txt) }); } }
  let tm; inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(run, 150); }); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = res.querySelector('.sri'); if (b) b.click(); } });
  function run() {
    const q = norm(inp.value.trim()); res.innerHTML = ''; if (q.length < 2) return;
    const hits = all.filter(a => a.n.includes(q)).sort((a, b) => b.m.localeCompare(a.m) || a.k.localeCompare(b.k)).slice(0, 80);
    if (!hits.length) { res.append(h('p', { class: 'hint' }, t('noResults'))); return; }
    for (const a of hits) {
      const [dw, sid] = a.k.split('|'), date = addDays(a.m, +dw - 1), i = a.n.indexOf(q), st = Math.max(0, i - 40);
      res.append(h('button', { class: 'sri', onclick: async () => { m.close(); ui.day = +dw; await goWeek(a.m, a.m > ui.monday ? 'l' : a.m < ui.monday ? 'r' : 'f'); setTimeout(() => flashCell(a.k), 380); } },
        h('div', { class: 'srh' }, h('span', null, cap(fmtDate(date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))), h('span', null, cellLabel(+dw, sid))),
        h('div', { class: 'srs' }, (st ? '…' : '') + a.txt.slice(st, i), h('mark', null, a.txt.slice(i, i + q.length)), a.txt.slice(i + q.length, i + q.length + 70) + (a.txt.length > i + q.length + 70 ? '…' : ''))));
    }

}
async function buildBackup() {
  if (notesTimer) await flushNotes();
  const weeks = {}; for (const m of await wList()) { const w = await readWeek(m); if (Object.keys(w).length) weeks[m] = w; }
  return { app: 'planif', version: 2, exportedAt: new Date().toISOString(), config: cfg, weeks };
}
function markExported() { if (!cfg) return; cfg.lastExport = todayISO(); cfg.remindAfter = null; saveCfg(); if (ui.backupDays != null) { ui.backupDays = null; renderBody(); } }
async function listSnapshots() { if (!useFS) return []; try { return (await FS.readdir({ path: BDIR, directory: 'DATA' })).files.map(fname).filter(n => /^planif-\d{4}-\d\d-\d\d\.json$/.test(n)).sort().reverse(); } catch { return []; } }
async function autoSnapshot() {
  if (!useFS || !cfg) return; const td = todayISO();
  if (cfg.lastSnapshot && daysBetween(cfg.lastSnapshot, td) < 7) return;
  try {
    const b = await buildBackup(); if (!Object.keys(b.weeks).length) return;
    await FS.writeFile({ path: `${BDIR}/planif-${td}.json`, directory: 'DATA', encoding: 'utf8', data: JSON.stringify(b), recursive: true });
    cfg.lastSnapshot = td; saveCfg();
    for (const n of (await listSnapshots()).slice(8)) { try { await FS.deleteFile({ path: `${BDIR}/${n}`, directory: 'DATA' }); } catch {} }
  } catch {}
}
async function restoreSnapshot(n) {
  try { const p = JSON.parse((await FS.readFile({ path: `${BDIR}/${n}`, directory: 'DATA', encoding: 'utf8' })).data);
    if (!await confirmDlg(t('restoreConfirm'), t('restore'))) return; await writeAll({ cfg: p.config, weeks: p.weeks || {} }); toast(t('importOk'));
  } catch { toast(t('importBad')); }
}
async function checkBackupReminder() {
  if (!cfg) return; const td = todayISO();
  if (cfg.remindAfter && td < cfg.remindAfter) return;
  if (cfg.lastExport && daysBetween(cfg.lastExport, td) < 30) return;
  const ws = await wList(); if (ws.length < 2) return;
  ui.backupDays = cfg.lastExport ? daysBetween(cfg.lastExport, td) : -1; renderBody();
}

/* ================= Sauvegarde / import ================= */
async function exportData() {
  if (notesTimer) await flushNotes();
  const text = JSON.stringify(await buildBackup(), null, 2);
  const name = `planif-${todayISO()}.json`;
  if (isNative && NP.Filesystem && NP.Share) {
    try { const r = await NP.Filesystem.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' }); await NP.Share.share({ title: name, url: r.uri, dialogTitle: t('export') }); markExported(); }
    catch (e) { if (!/cancel/i.test(String(e && e.message))) toast(t('exportFail')); }
    return;
  }
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name }); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); markExported(); toast(t('exported'));
}
function fromLegacy(p) {
  const old = p.config || {}; const DN = { Lundi: 1, Mardi: 2, Mercredi: 3, Jeudi: 4, Vendredi: 5, Samedi: 6, Dimanche: 7 };
  const periods = (old.periods || []).slice().sort((a, b) => toMin(a.start) - toMin(b.start));
  const slots = [], pid = {};
  periods.forEach((pp, i) => {
    if (i > 0) { const pe = toMin(periods[i - 1].end), st = toMin(pp.start); if (st - pe >= 5) slots.push({ id: uid(), type: st - pe >= 30 ? 'lunch' : 'break', label: '', start: fromMin(pe), end: pp.start }); }
    const id = uid(); pid[pp.n] = id; slots.push({ id, type: 'lesson', label: '', start: pp.start, end: pp.end });
  });
  const subjects = [], sid = {};
  for (const [code, s] of Object.entries(old.subjects || {})) { const id = uid(); sid[code] = id; subjects.push({ id, name: s.name, short: code, color: normHex(s.color) || randColor() }); }
  const lessons = [];
  for (const [day, arr] of Object.entries(old.schedule || {})) for (const b of arr || []) { if (!DN[day] || !pid[b.start] || !sid[b.code]) continue; lessons.push({ id: uid(), dow: DN[day], from: pid[b.start], to: pid[b.end] || pid[b.start], subjectId: sid[b.code], cls: b.classe || '', room: b.salle || '' }); }
  const weeks = {};
  for (const [k, v] of Object.entries(p.weeks || {})) { const m = k.replace(/^week:/, ''); const o = {}; for (const [nk, html] of Object.entries(v || {})) { const [d, n] = nk.split('-'); if (DN[d] && pid[n] && html) o[DN[d] + '|' + pid[n]] = html; } weeks[m] = o; }
  const c = defaultConfig('fr'); Object.assign(c, { slots, subjects, lessons });
  return { cfg: c, weeks };
}
function importData() {
  const inp = h('input', { type: 'file', accept: isNative ? null : '.json,application/json', style: { display: 'none' } });
  inp.addEventListener('change', async () => {
    const file = inp.files && inp.files[0]; inp.remove(); if (!file) return;
    let res;
    try { const p = JSON.parse(await file.text()); if (p && p.config && Array.isArray(p.config.slots)) res = { cfg: p.config, weeks: p.weeks || {} }; else if (p && p.config && Array.isArray(p.config.periods)) res = fromLegacy(p); else throw 0; }
    catch { toast(t('importBad')); return; }
    if (!await confirmDlg(t('importConfirm'), t('import'))) return;
    await writeAll(res); toast(t('importOk'));
  });
  document.body.append(inp); inp.click();
}
async function writeAll(res) {
  for (const m of await wList()) await wRemove(m);
  for (const k of await store.keys()) if (k.startsWith('pl2.')) await store.remove(k);
  const c = fixCfg(res.cfg); await store.set(KEY_CFG, JSON.stringify(c));
  for (const [m, v] of Object.entries(res.weeks || {})) if (/^\d{4}-\d{2}-\d{2}$/.test(m) && v && typeof v === 'object' && Object.keys(v).length) await wSet(m, JSON.stringify(v));
  cfg = c; notesMonday = null; closePop(); while (modals.length) modals[modals.length - 1].close();
  await boot2();
}
async function resetAll() { clearTimeout(notesTimer); notesTimer = null; notesMonday = null; for (const m of await wList()) await wRemove(m); for (const k of await store.keys()) if (k.startsWith('pl2.')) await store.remove(k); cfg = null; startOnboarding(); }

/* ================= Premier lancement ================= */
function detectLang() { const l = (navigator.language || 'fr').toLowerCase(); return l.startsWith('de') ? 'de' : l.startsWith('fr') ? 'fr' : 'en'; }

  const o = { lang: detectLang(), name: '', theme: 'midnight', gen: defaultGen(), year: defaultYear(), days: [1, 2, 3, 4, 5] };
  LANG = o.lang; applyTheme(o.theme); let step = 0;
  app.innerHTML = ''; const wrap = h('div', { class: 'onb' }); app.append(wrap);
  function draw() {
    LANG = o.lang; document.documentElement.lang = LANG; wrap.innerHTML = ''; let body;
    if (step === 0) body = [h('div', { class: 'logo big' }, icon('calendar', 32)), h('h1', null, t('welcome')), h('p', { class: 'lead' }, t('welcomeSub')),
      h('h3', { class: 'sh' }, t('chooseLang')), langCards(o.lang, id => { o.lang = id; draw(); }),
      h('button', { class: 'link', onclick: () => importData() }, icon('upload', 15), t('haveBackup'))];
    if (step === 1) body = [h('h1', null, t('stepLook')), field(t('yourName'), h('input', { class: 'inp', value: o.name, oninput: e => o.name = e.target.value })),
      h('h3', { class: 'sh' }, t('theme')), themeGrid(o.theme, id => { o.theme = id; applyTheme(id); draw(); })];
    if (step === 2) { const prev = h('div', { class: 'genprev' }, genPreview(o.gen));
      body = [h('h1', null, t('stepDay')), h('p', { class: 'lead' }, t('genHint')), genForm(o.gen, () => { prev.innerHTML = ''; prev.append(...genPreview(o.gen)); }), prev]; }
    if (step === 3) body = [h('h1', null, t('stepYear')), h('div', { class: 'calbox' }, h('p', null, t('calIntro')),
        h('button', { class: 'btn primary', onclick: () => calendarDialog(o.year, ny => { o.year = ny; draw(); }) }, icon('calendar', 16), t('calRegionBtn')),
        (o.year.vacations.length || o.year.holidays.length) ? h('p', { class: 'summary' }, '✓ ' + calSummary(o.year)) : null),
      h('div', { class: 'grid2' },
        field(t('yearStart'), h('input', { class: 'inp', type: 'date', value: o.year.start, onchange: e => o.year.start = e.target.value })),
        field(t('yearEnd'), h('input', { class: 'inp', type: 'date', value: o.year.end, onchange: e => o.year.end = e.target.value }))),
      h('h3', { class: 'sh' }, t('daysShown')), dayChips(o.days, draw), h('p', { class: 'hint' }, t('yearHint'))];
    wrap.append(h('div', { class: 'ocard' },

      h('div', { class: 'onav' }, step > 0 ? h('button', { class: 'btn', onclick: () => { step--; draw(); } }, t('back')) : h('span'),

  }

    await store.set(KEY_CFG, JSON.stringify(cfg)); await boot2(); toast(t('welcomeTip'), 4500);

/* ================= Démarrage ================= */
async function boot2() {
  LANG = cfg.lang; ui.view = storedView() || (mq.matches ? 'day' : 'week');
  ui.monday = initialMonday(); const td = todayISO();
  ui.day = (mondayOf(td) === ui.monday && shownDays().includes(dowOf(td))) ? dowOf(td) : shownDays()[0];
  ui.anim = 'f'; await loadNotes(); renderApp();
  setTimeout(async () => { await autoSnapshot(); await checkBackupReminder(); }, 800);
}
async function boot() {
  try { await migrateWeeks(); } catch {}
  let raw = null; try { raw = await store.get(KEY_CFG); } catch {}
  if (!raw) { startOnboarding(); return; }
  try { cfg = fixCfg(JSON.parse(raw)); } catch { startOnboarding(); return; }
  await boot2();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (notesTimer) flushNotes(); if (cfgTimer) { clearTimeout(cfgTimer); cfgTimer = null; store.set(KEY_CFG, JSON.stringify(cfg)); } } else markNow(); });

boot();
